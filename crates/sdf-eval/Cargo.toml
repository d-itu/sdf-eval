[package]
name = "sdf-eval"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures = { version = "0.3.34", default-features = false, features = ["executor", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wgpu = { version = "30.0.1", features = ["glsl", "naga-ir"] }
